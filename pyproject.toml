[project]
name = "constrainslens"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nguyen Luan", email = "nguyenluanono@gmail.com" }
]
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.162.2",
    "google-genai>=2.34.0",
    "httpx>=0.28.1",
    "ortools>=9.11.4210",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "pydantic>=2.14.3",
    "streamlit>=1.67.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
constrainslens = "constrainslens:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
